name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install '.[dev]'
      - run: python -m coverage run
      - run: python -m coverage report

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install '.[dev]'
      - name: black
        run: python -m black --check --diff .
      - name: isort
        run: python -m isort --check-only --diff .
      - name: uv.lock is in sync with pyproject.toml
        run: |
          pip install uv
          uv lock --check

  bump-and-release:
    name: Bump version and publish
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tools
        run: pip install bump-my-version build

      - name: Determine version bump
        id: bump_level
        uses: actions/github-script@v8
        with:
          script: |
            // No release when the push changed nothing shippable (planning
            // docs, context, markdown, CI config). On any doubt (compare
            // fails, file list truncated) fall through to releasing.
            const NON_RELEASE = [/^planning\//, /^context\//, /^docs\//, /^\.github\//, /\.md$/i, /^\.gitignore$/];
            try {
              const { data: cmp } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: context.payload.before,
                head: context.payload.after,
              });
              const files = (cmp.files || []).map(f => f.filename);
              if (files.length > 0 && files.every(f => NON_RELEASE.some(rx => rx.test(f)))) {
                core.setOutput('level', 'none');
                return;
              }
            } catch (e) {
              core.info(`compare failed (${e.message}); defaulting to release`);
            }
            const commits = context.payload.commits || [];
            const mergeCommit = commits.find(c => c.message.startsWith('Merge pull request'));
            if (mergeCommit) {
              const match = mergeCommit.message.match(/#(\d+)/);
              if (match) {
                const pr = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: parseInt(match[1])
                });
                const labels = pr.data.labels.map(l => l.name);
                if (labels.includes('bump:major')) {
                  core.setOutput('level', 'major');
                  return;
                }
                if (labels.includes('bump:minor')) {
                  core.setOutput('level', 'minor');
                  return;
                }
              }
            }
            core.setOutput('level', 'patch');

      - name: Bump version
        if: steps.bump_level.outputs.level != 'none'
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bump-my-version bump ${{ steps.bump_level.outputs.level }}
          echo "new_version=$(bump-my-version show current_version)" >> "$GITHUB_OUTPUT"

      - name: Push version commit and tag
        if: steps.bump_level.outputs.level != 'none'
        run: git push --follow-tags

      - name: Build package
        if: steps.bump_level.outputs.level != 'none'
        run: python -m build

      - name: Publish to PyPI
        if: steps.bump_level.outputs.level != 'none'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: steps.bump_level.outputs.level != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          generate_release_notes: true
